name: Publish npm package

# Publishes when a version tag is pushed:
#   npm version patch|minor|major   # bumps package.json and creates the tag
#   git push --follow-tags
on:
    push:
        tags:
            - "v*"

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                node: [20, 22, 24]

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  package-manager-cache: false

            - run: npm ci
            - run: npm test
            - run: npm run test:integration

    publish:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # npm trusted publishing (OIDC)

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false

            - name: Tag must match package.json
              run: |
                  expected="v$(node -p "require('./package.json').version")"
                  if [ "$GITHUB_REF_NAME" != "$expected" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
                      exit 1
                  fi

            - run: npm ci
            - run: npm publish
