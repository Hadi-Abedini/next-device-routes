name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [20, 22, 24]

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  package-manager-cache: false

            - run: npm ci
            - run: npm test
            - run: npm run test:integration

    # The supported Next.js range is >=14; the suites above run against the newest 15.
    compat:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 20
                  package-manager-cache: false

            - run: npm ci
            - name: Install Next.js 14 and React 18
              run: npm install --no-save next@14 react@18 react-dom@18
            - run: npm test
            - run: npm run test:integration
